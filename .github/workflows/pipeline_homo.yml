name: Ambiente de Homologação

on:
  push:
    branches: [ "Homologacao", "homologacao" ]
  pull_request:
    branches: [ "Homologacao", "homologacao" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

  Imagem:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PWD }}

      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            denisgoes/homologacao:latest
            denisgoes/homologacao:${{ github.sha }}

  DEPLOY:
    name: Implantando na EC2
    runs-on: ubuntu-latest
    needs: Imagem

    steps:
      - name: Deploy na EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "Conectado com sucesso na EC2!"

            # 1. Baixar a imagem mais recente
            sudo docker pull denisgoes/homologacao:latest

            # 2. Identificar e PARAR qualquer container rodando na porta 80
            CONTAINER_PORT_80=$(sudo docker ps -q --filter "publish=80")
            if [ -n "$CONTAINER_PORT_80" ]; then
              echo "Parando container existente na porta 80: $CONTAINER_PORT_80"
              sudo docker stop $CONTAINER_PORT_80
              sudo docker rm $CONTAINER_PORT_80
            fi

            # 3. Forçar remocao do container antigo com nome homo_leopoldina se existir
            sudo docker rm -f homo_leopoldina 2>/dev/null || true

            # 4. Subir o novo container
            sudo docker run -d --name homo_leopoldina -p 80:80 --restart always denisgoes/homologacao:latest
