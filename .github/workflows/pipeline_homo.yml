name: Ambiente de Homologação

on:
  push:
    branches: [ "Homologacao", "homologacao" ]
  pull_request:
    branches: [ "Homologacao", "homologacao" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

  Imagem:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PWD }}

      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            denisgoes/homologacao:latest
            denisgoes/homologacao:${{ github.sha }}

  DEPLOY:
    name: Implantando na EC2
    runs-on: ubuntu-latest
    needs: Imagem

    steps:
      - name: Deploy na EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "Conectado com sucesso na EC2!"

            # 1. Parar e desativar o Nginx estático do SO para liberar a porta 80
            sudo systemctl stop nginx 2>/dev/null || true
            sudo systemctl disable nginx 2>/dev/null || true

            # 2. Fazer o pull da imagem mais recente do Docker Hub
            sudo docker pull denisgoes/homologacao:latest

            # 3. Parar e remover o container anterior (se existir)
            sudo docker stop homo_leopoldina 2>/dev/null || true
            sudo docker rm homo_leopoldina 2>/dev/null || true

            # 4. Iniciar o novo container mapeando a porta 80
            sudo docker run -d --name homo_leopoldina -p 80:80 --restart always denisgoes/homologacao:latest
